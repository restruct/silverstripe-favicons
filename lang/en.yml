en:
  Restruct\Favicons\FaviconService:
    ERROR_NOT_PNG: 'The file is not a PNG image.'
    ERROR_TOO_SMALL: 'The image is {w}x{h} px; it must be at least {min}x{min} px.'
    ERROR_TOO_LARGE: 'The image is {w}x{h} px; it must be at most {max}x{max} px.'
    STATUS_SKIPPED: 'Skipped {origin}: {error}'
    STATUS_NONE: 'No usable favicon source; nothing is served.'
