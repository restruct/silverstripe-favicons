---
Name: restruct-favicons
After:
  - '#requestprocessors'
  - '#coresecurity'
---
# Answer /favicon.ico, /apple-touch-icon*.png, /site.webmanifest, /manifest.json etc. before routing.
# Added after core's request processors, so it runs inside them: allowed-hosts, trusted-proxy and
# basic-auth checks still apply to icon requests, and HTTPCacheControlMiddleware keeps the
# Cache-Control header set here (it only adds headers a response does not have yet).
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        FaviconMiddleware: '%$Restruct\Favicons\Control\FaviconMiddleware'
  # Source hashes and checks, the registry of generated sets, busy and failure markers. The
  # images themselves live in the AssetStore. No expiry: keys contain the content hash, so stale
  # entries are never read.
  #
  # A plain filesystem pool under TEMP_PATH rather than CacheFactory, because this cache must be
  # ONE store for every process and stage:
  # - CacheFactory on Silverstripe 5 picks PhpFilesAdapter where opcache is on (usually the web
  #   server) and FilesystemAdapter where it is off (usually the CLI), so a set generated on
  #   dev/build was invisible to the site (seen in CI: no tags after a fresh build).
  # - CacheFactory's versioned wrapper segments by reading mode: the icon middleware runs before
  #   VersionedMiddleware, pages read Live, the CMS and dev/build Stage, so each saw its own
  #   registry and never cleaned up the others' sets.
  # Override this service (eg with a Redis pool) to share it between web servers.
  Psr\SimpleCache\CacheInterface.RestructFavicons:
    class: Symfony\Component\Cache\Psr16Cache
    constructor:
      pool: '%$RestructFaviconsCachePool'
  RestructFaviconsCachePool:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    constructor:
      namespace: 'RestructFavicons'
      defaultLifetime: 0
      directory: '`TEMP_PATH`'

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - Restruct\Favicons\Extensions\SiteConfigFaviconExtension

# CMS backend
SilverStripe\Admin\LeftAndMain:
  extensions:
    - Restruct\Favicons\Extensions\FaviconHeadTagsExtension

# Login, lost-password and other Security pages
SilverStripe\Security\Security:
  extensions:
    - Restruct\Favicons\Extensions\FaviconHeadTagsExtension

---
Name: restruct-favicons-frontend
Only:
  classexists: 'SilverStripe\CMS\Controllers\ContentController'
---
# Frontend pages. Guarded because silverstripe/cms is only suggested.
SilverStripe\CMS\Controllers\ContentController:
  extensions:
    - Restruct\Favicons\Extensions\FaviconHeadTagsExtension
